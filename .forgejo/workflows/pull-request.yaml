---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Validate Pull Request

on:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.set-fallback.outputs.changed_files || steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        uses: https://github.com/bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        id: changed-files
        with:
          path: apps
          include_only_directories: true
          max_depth: 1

      - name: Set fallback for empty changes
        id: set-fallback
        if: ${{ steps.changed-files.outputs.changed_files == '[]' }}
        run: |
          echo "changed_files=[\"__skip__\"]" >> "${FORGEJO_OUTPUT}"

  build:
    if: ${{ needs.prepare.outputs.changed-files != '[]' }}
    name: Build and test
    needs:
      - prepare
    runs-on: docker
    strategy:
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.changed-files) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Check for skip
        if: ${{ matrix.app == '__skip__' }}
        run: echo "No apps changed, skipping build"

      - name: Checkout
        if: ${{ matrix.app != '__skip__' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check whether app directory exists
        if: ${{ matrix.app != '__skip__' }}
        id: app-check
        run: |
          if [ -d "apps/${{ matrix.app }}" ]; then
            echo "exists=true" >> "${FORGEJO_OUTPUT}"
          else
            echo "App directory was deleted; skipping image build and tests"
            echo "exists=false" >> "${FORGEJO_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        if: ${{ matrix.app != '__skip__' && steps.app-check.outputs.exists == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Add include directory to build context
        if: ${{ matrix.app != '__skip__' && steps.app-check.outputs.exists == 'true' }}
        run: |-
          rsync -a --ignore-existing --progress ./include/ ./apps/${{ matrix.app }}/

      - name: Build multi-platform image
        if: ${{ matrix.app != '__skip__' && steps.app-check.outputs.exists == 'true' }}
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          load: false
          push: false
          files: ./docker-bake.hcl
          source: ./apps/${{ matrix.app }}
          targets: image-all
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Build image for testing
        if: ${{ matrix.app != '__skip__' && steps.app-check.outputs.exists == 'true' }}
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        id: bake
        with:
          load: true
          push: false
          files: ./docker-bake.hcl
          source: ./apps/${{ matrix.app }}
          targets: image-local
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Set up Go
        if: ${{ matrix.app != '__skip__' && steps.app-check.outputs.exists == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run Tests
        if: ${{ matrix.app != '__skip__' && steps.app-check.outputs.exists == 'true' }}
        shell: bash
        env:
          APP: ${{ matrix.app }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TEST_IMAGE: >-
            ${{ matrix.app != '__skip__' && format('{0}@{1}', matrix.app, fromJSON(steps.bake.outputs.metadata)['image-local']['containerimage.digest']) || '' }}
        run: |-
          echo "Running tests against ${TEST_IMAGE}"
          go test -v ./apps/${APP}/...

  build-success:
    needs:
      - build
    if: ${{ !cancelled() }}
    name: Build and test - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: echo "All jobs passed or skipped"
